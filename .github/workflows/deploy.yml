
name: Deploy Angular Holiday List to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  APP_DIR: New Website using Angular/mum-holiday-list-app

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: read
      id-token: write

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: New Website using Angular/mum-holiday-list-app/package-lock.json

      # Install dependencies
      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      # Build Angular application
      - name: Build Angular application
        working-directory: ${{ env.APP_DIR }}
        run: npm run build -- --base-href /SBSMumbaiHolidayList/

      # Detect Angular build output directory
      - name: Detect build output directory
        id: output
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          if [ ! -d "dist" ]; then
            echo "Angular dist folder not found!"
            exit 1
          fi

          INDEX_FILE=$(find dist -type f -name index.html -print -quit)

          if [ -z "$INDEX_FILE" ]; then
            echo "Angular index.html not found!"
            exit 1
          fi

          PUBLISH_DIR=$(dirname "$INDEX_FILE")

          echo "Build output found: $PUBLISH_DIR"

          echo "path=$GITHUB_WORKSPACE/$APP_DIR/$PUBLISH_DIR" >> "$GITHUB_OUTPUT"

      # Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Add .nojekyll
      - name: Add .nojekyll
        run: touch "${{ steps.output.outputs.path }}/.nojekyll"

      # Upload build artifact
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.output.outputs.path }}

  # Deploy job
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
