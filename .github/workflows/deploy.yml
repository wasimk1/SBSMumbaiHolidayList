
name: Deploy Angular Holiday List to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  APP_DIR: New Website using Angular/mum-holiday-list-app

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: New Website using Angular/mum-holiday-list-app/package-lock.json

      - name: Install dependencies
        working-directory: New Website using Angular/mum-holiday-list-app
        run: npm ci

      - name: Build Angular application
        working-directory: New Website using Angular/mum-holiday-list-app
        run: npm run build -- --base-href /SBSMumbaiHolidayList/

      - name: Detect build output directory
        id: output
        working-directory: New Website using Angular/mum-holiday-list-app
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const config = JSON.parse(
            fs.readFileSync('angular.json', 'utf8')
          );

          const projectName =
            config.defaultProject || Object.keys(config.projects)[0];

          const project = config.projects[projectName];

          const build =
            project.architect?.build || project.targets?.build;

          if (!build || !build.options.outputPath) {
            throw new Error('Angular outputPath not found.');
          }

          const output = build.options.outputPath;
          const base = typeof output === 'string' ? output : output.base;
          const browserFolder =
            typeof output === 'object' && output.browser
              ? output.browser
              : 'browser';

          const browserPath = path.join(base, browserFolder);

          const publishPath = fs.existsSync(browserPath)
            ? browserPath
            : base;

          if (!fs.existsSync(path.join(publishPath, 'index.html'))) {
            throw new Error(`index.html not found in ${publishPath}`);
          }

          const absolutePath = path.resolve(publishPath);

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `path=${absolutePath}\n`
          );

          console.log(`Publishing: ${absolutePath}`);
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Add .nojekyll
        run: touch "${{ steps.output.outputs.path }}/.nojekyll"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.output.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
