
name: Deploy Angular Holiday List to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: read
      id-token: write

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build Angular application
      - name: Build Angular application
        run: npm run build -- --base-href /SBSMumbaiHolidayList/

      # Detect Angular build output directory
      - name: Detect build output directory
        id: output
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const config = JSON.parse(
            fs.readFileSync('angular.json', 'utf8')
          );

          const projectName =
            config.defaultProject || Object.keys(config.projects)[0];

          const project = config.projects[projectName];

          const build =
            project.architect?.build || project.targets?.build;

          if (!build) {
            throw new Error('Angular build configuration not found.');
          }

          const output = build.options.outputPath;

          if (!output) {
            throw new Error('Angular outputPath not found.');
          }

          const base =
            typeof output === 'string' ? output : output.base;

          const browserFolder =
            typeof output === 'object' && output.browser
              ? output.browser
              : 'browser';

          const browserPath = path.join(base, browserFolder);

          const publishPath = fs.existsSync(browserPath)
            ? browserPath
            : base;

          if (!fs.existsSync(path.join(publishPath, 'index.html'))) {
            throw new Error(
              `index.html not found in ${publishPath}`
            );
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `path=${publishPath}\n`
          );

          console.log(`Publishing directory: ${publishPath}`);
          NODE

      # Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Add .nojekyll file
      - name: Add .nojekyll
        run: touch "${{ steps.output.outputs.path }}/.nojekyll"

      # Upload build artifact
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.output.outputs.path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
